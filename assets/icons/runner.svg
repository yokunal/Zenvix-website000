<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28" shape-rendering="crispEdges">
  <!-- Original Retro Pixel Runner Character -->
  <!-- Head / Helmet -->
  <rect x="8" y="2" width="10" height="2" fill="#1F2F55"/>
  <rect x="6" y="4" width="14" height="6" fill="#1F2F55"/>
  <!-- Visor / Eye (Mustard) -->
  <rect x="14" y="6" width="6" height="2" fill="#C98A1B"/>
  <rect x="16" y="6" width="2" height="2" fill="#FFFFFF"/>
  <!-- Torso -->
  <rect x="8" y="10" width="10" height="8" fill="#1F2F55"/>
  <rect x="10" y="11" width="6" height="6" fill="#F4F0E4"/>
  <!-- Core indicator -->
  <rect x="12" y="13" width="2" height="2" fill="#C98A1B"/>
  <!-- Running Arms -->
  <rect x="4" y="11" width="4" height="4" fill="#1F2F55"/>
  <rect x="18" y="13" width="4" height="4" fill="#1F2F55"/>
  <!-- Legs (Dynamic Runner Stride) -->
  <rect x="8" y="18" width="4" height="4" fill="#1F2F55"/>
  <rect x="6" y="22" width="4" height="4" fill="#1F2F55"/>
  <rect x="4" y="24" width="4" height="2" fill="#3B382F"/>
  <rect x="14" y="18" width="4" height="5" fill="#1F2F55"/>
  <rect x="16" y="23" width="5" height="3" fill="#3B382F"/>
</svg>
