<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" shape-rendering="crispEdges">
  <!-- Multilingual translation bubbles -->
  <rect x="2" y="2" width="13" height="11" fill="#1F2F55"/>
  <rect x="4" y="4" width="9" height="7" fill="#F4F0E4"/>
  <rect x="2" y="13" width="3" height="2" fill="#1F2F55"/>
  <!-- Pixel letter 'A' -->
  <rect x="7" y="6" width="3" height="1" fill="#1F2F55"/>
  <rect x="6" y="7" width="1" height="3" fill="#1F2F55"/>
  <rect x="9" y="7" width="1" height="3" fill="#1F2F55"/>
  <rect x="7" y="8" width="2" height="1" fill="#1F2F55"/>

  <!-- Second bubble overlapping -->
  <rect x="9" y="10" width="13" height="11" fill="#C98A1B"/>
  <rect x="11" y="12" width="9" height="7" fill="#F4F0E4"/>
  <rect x="19" y="21" width="3" height="2" fill="#C98A1B"/>
  <!-- Indic symbol pattern -->
  <rect x="14" y="13" width="3" height="1" fill="#1F2F55"/>
  <rect x="15" y="14" width="1" height="4" fill="#1F2F55"/>
  <rect x="13" y="15" width="2" height="2" fill="#1F2F55"/>
</svg>
